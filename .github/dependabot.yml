version: 2
updates:
  # npm (root, UploadBOM, AddProjectVersion): one grouped PR for minor/patch updates
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/UploadBOM"
      - "/AddProjectVersion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: one grouped PR for minor/patch updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

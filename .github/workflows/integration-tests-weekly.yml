name: Integration Tests - Weekly

on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration_tests:
    name: "Integration Tests - ${{ matrix.task }} (DT v${{ matrix.dtrack }})"
    runs-on: k8s-runners
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: [UploadBOM, AddProjectVersion]
        dtrack: [4, 5]
    env:
      DTRACK_MAJOR_VERSION: ${{ matrix.dtrack }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Generate certificates
        run: bash test-environment/generate-certs.sh

      - name: Start Dependency-Track
        run: bash test-environment/dtrack-environment.sh start

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.task }}

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ${{ matrix.task }}

      - name: Dump container logs
        if: ${{ failure() }}
        run: docker ps -a && docker logs dtrack-apiserver --tail 200

      - name: Stop Dependency-Track
        if: ${{ always() }}
        run: bash test-environment/dtrack-environment.sh stop
